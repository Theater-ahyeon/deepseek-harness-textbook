    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a8afff"/><stop offset="1" stop-color="#69e4e0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#58d7df" stop-opacity=".16"/><stop offset="1" stop-color="#58d7df" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7c9abe" stroke-opacity=".09"/></pattern>
  </defs>
