<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">深入理解 DeepSeek Harness：中文源码导学教材</title>
  <desc id="desc">十九章系统导学、二十七段实现详解、四十二幅讲解配图、十四组选型比较。沿任务接纳、Agent 循环、工具执行和 Session 记录理解项目。</desc>
